version: v1.0
name: "\U0001F48E Ruby CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  cancel:
    when: 'true'
auto_cancel:
  running:
    when: 'true'
execution_time_limit:
  minutes: 5
global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version ruby 3.2
blocks:
  - name: Test Github clone
    task:
      jobs:
        - name: test direct HTTPS clone
          commands:
            - 'git clone https://github.com/semaphoreio/test-reports-rspec.git'
        - name: Test tool using github HTTPS clone
          commands:
            - bundle install
    dependencies: []
after_pipeline:
  task:
    jobs:
      - name: "\U0001F4CA Merge Results"
        commands:
          - test-results gen-pipeline-report
