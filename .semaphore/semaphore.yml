version: v1.0
name: "\U0001F48E Ruby CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
fail_fast:
  cancel:
    when: 'true'
auto_cancel:
  running:
    when: 'true'
execution_time_limit:
  minutes: 1
global_job_config:
  prologue:
    commands:
      - checkout
      - 'export GIT_TERMINAL_PROMPT=0 '
      - sem-version ruby 3.4
blocks:
  - name: Test Github clone
    task:
      jobs:
        - name: test direct HTTPS clone
          commands:
            - 'git clone https://github.com/semaphoreio/test-reports-rspec'
        - name: Test tool using github HTTPS clone
          commands:
            - bundle install
        - name: test direct clone with proposed workaround
          commands:
            - git config --global http.version HTTP/1.1
            - 'git clone https://github.com/semaphoreio/test-reports-rspec'
        - name: test tool using calling github clone with proposed workaround
          commands:
            - git config --global http.version HTTP/1.1
            - bundle install
    dependencies: []
after_pipeline:
  task:
    jobs:
      - name: "\U0001F4CA Merge Results"
        commands:
          - test-results gen-pipeline-report
